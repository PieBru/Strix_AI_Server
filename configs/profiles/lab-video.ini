# lab-video — the video bench: MiniMax-H3 in ComfyUI, its simple UI, the LTX-2.5 UI, and
# Gemma as the text arm.
#
# 27b-collm is deliberately NOT in this list. Measured 260927 with an H3 render running
# alongside: 27B-Q8 -> OOM, Gemma4-QAT -> PASS (render 120 s, replies in 3.5 s mid-render,
# 60 GiB free at peak). That is recorded in AGENTS.md; it is history, not an artifact this
# tool can point at, so `verified` stays empty until the gate re-measures it.
name            = lab-video
summary         = H3 + LTX video bench, Gemma as the arm that survives a render
start           = comfyui-h3 h3-video-ui ltx25-ui gemma-collm
text_arm        = gemma-collm
text_port       = 8080
budget_gtt_gib  = 96
workload        = video
gate_max_age_h  = 168
# co-residency measured by this tool on 260930 (the 260927 note below is real history but was
# never this tool's artifact). gemma + H3 + two UIs probed concurrently: GTT peak 40.11 %
# (floor 36 GiB cleared), swap 0.04 MiB, 2/2 model units resident, overlap 1.15 s.
# ltx25-ui is in the allow-list with NO probe on purpose: a probe that can never pass is not
# evidence, it is a permanently red card. The renderer IS built (vllm.cpp Vulkan,
# build-vulkan/examples/ltx2-gen) and the weights are on disk; what is missing is the
# LICENCE-GATED conv video VAE. Measured again 260930, 111 s to refusal: the only VAE we hold
# is the diffusion-decoder build and the engine refuses it by name — "vae.decoder_blocks is
# empty; there is no decoder to build". Unblock: accept the terms at
# huggingface.co/Lightricks/LTX-2.5, then HF_TOKEN=... bash scripts/fetch-ltx25.sh (the script
# picks the conv build up by itself). When a clip actually renders, port
# scripts/ltx25-smoke.sh into scripts/profile_probes.py and register it in PROBES.
# A probe-less unit is still an honest allow-list entry as long as the profile says so out
# loud — strix-gate prints it as "no probe" instead of skipping it.
verified        = 260930 d01bda3 /home/piero/.local/share/strix/gate/evidence-lab-video.json
