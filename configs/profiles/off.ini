# off — nothing running. The box is a computer again.
#
# `start` is empty on purpose, which under allow-list semantics means every managed unit is
# drift: `strix-profile apply off` stops all thirteen. This is the profile that makes
# "shut the lab down" one command instead of twelve, and it is the reason the loader accepts
# an empty allow-list at all.
name            = off
summary         = nothing running; every managed unit is drift
start           =
text_arm        =
budget_gtt_gib  = 0
workload        = none
gate_max_age_h  = 87600
# co-residency verified: n/a — there is nothing here to co-reside.
verified        =
