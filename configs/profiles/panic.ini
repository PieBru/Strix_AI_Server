# panic — free the GPU, now. The shape you reach for when something is wedged, an
# experiment is eating the box, or you need the memory back in one command.
# `start` is an ALLOW-list: every managed unit not named here is stopped, including units
# added after this file was written. Mirrored in scripts/strix-profile BUILTIN, so this
# still resolves if ~/.config is unreadable (check_profiles() compares the two field by
# field — a divergence there is a bug, not a style choice).
name            = panic
summary         = free the GPU now; only the SOS arm stays up
start           = sos-collm
text_arm        = sos-collm
text_port       = 8082
budget_gtt_gib  = 8
workload        = text
# Never gated on load-test evidence: panic IS the response to the box being wrong, and a
# stale gate must not stand in the way of freeing memory.
gate_max_age_h  = 87600
# co-residency verified: NEVER — one unit, nothing to co-reside with.
verified        =
