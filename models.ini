# Qwen3.8 Flash-Next Q5_K_XL — single-model configuration
# Generic options in [*]; everything model-specific in the arm section.
# Both the HIP and Vulkan units point here — only binary-specific flags
# (device selection, lazy-load spellings) stay on the systemd command line.
# Update the paths to match your layout.

[*]
models-max = 1
host = 0.0.0.0            # LAN-exposed by design: trusted LAN, no auth (operator
                          # decision). CAVEAT: the pwilkin router build ignores this
                          # key in preset mode — pass --host on the unit CLI
port = 8080
ngl = all
fa = on                   # flash attention

[qwen38-flash-q5]
LLAMA_ARG_ALIAS = default,quality,fast
load-on-startup = true
# we use a tuned template variant; the stock template works too
# (vendored in this repo at configs/templates/ — see the README chapter)
chat-template-file = /path/to/templates/sharp-v22.5.0.jinja
model = /path/to/Qwen3.8-Flash-Next-UD-Q5_K_XL-00001-of-00006.gguf
# vision projector (optional — remove for text-only, saves ~0.9G)
mmproj = /path/to/mmproj-BF16.gguf
model-draft = /path/to/mtp-Qwen3.8-Flash-Next-shared-Q8_0.gguf
spec-type = draft-mtp,ngram-mod
spec-draft-n-max = 5
spec-draft-n-min = 0
temp = 1.0                # producer-recommended for Qwen3.8
top-p = 0.95
top-k = 20
kvu = on                  # unified KV cache
fit = off                 # no in-fit tensor recomputation (no measured benefit here)
np = 1                    # one decoding slot — full context for one client
jinja = on                # use the model's chat template
c = 262144                # full native context; reduce if RAM-constrained
b = 8192
ub = 4096                 # bounds PLE row-reader RAM; don't raise on 128G boxes
ctk = f16
ctv = f16
