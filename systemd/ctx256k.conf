# ctx256k.conf — drop-in for gufo-llm (strixy2). MIRROR of
# strixy2:~/.config/systemd/user/gufo-llm.service.d/ctx256k.conf, taken 260929.
# It was not in this repo at all, so a restore from the repo could not reproduce the
# champion's real 262144 context; the base unit alone gives 131072.
#
# Order matters: systemd applies drop-ins alphabetically, so this one must sort
# before zz-cache-disk.conf (whose ExecStart re-states the whole line, 262144 +
# --cache-disk). Anything sorting after zz-* would silently win over it.
#
# RAM note from the live box: 262144 is why the arm sits at ~92 GiB GTT; -j 2 on top
# of it measured +3 GiB and 27.8 t/s when two requests actually overlapped (see
# zz-cache-disk.conf), so width is not the lever here.
[Service]
ExecStart=
ExecStart=/home/piero/gufo-bench/gufo serve llm --model /home/piero/Downloads/LLM/Qwen38/flash-next-unsloth/UD-Q4_K_XL/Qwen3.8-Flash-Next-UD-Q4_K_XL-00001-of-00004.gguf --mmproj /home/piero/Downloads/LLM/Qwen38/flash-next-unsloth/mmproj-BF16.gguf --mtp-model /home/piero/Downloads/LLM/Qwen38/flash-next/mtp-Qwen3.8-Flash-Next-shared-Q8_0.gguf --speculative mtp -d 3 --reasoning-effort low -c 262144 -i 0.0.0.0 -p 8080 --served-model-name default
