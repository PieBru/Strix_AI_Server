# oom-neutral.conf — drop-in for the heavy GPU arms. Installed by
# install-oom-neutral.sh; do not edit the copies, edit this one and re-run.
#
# WHY: every service in a systemd --user manager here defaults to
# oom_score_adj=200, which makes the 90 GB serving arm the kernel's first OOM
# pick. That is what killed the serving router child at 03:54:49 on 260922
# (doctor P1, open until 260928).
#
# WHY 0 AND NOT -500: a non-privileged user manager cannot lower a score below
# its own (100). Measured on this box with systemd-run: with this property the
# process lands at live=100, without it at live=200. 0 is therefore the floor,
# not a pretence of immunity — the arm stops volunteering, it does not become
# unkillable.
#
# Takes effect on the unit's NEXT start. Undo: rm the drop-in + daemon-reload.
[Service]
OOMScoreAdjust=0
