# Mirror of ~/.config/systemd/user.conf.d/startlimit.conf — keep the two identical.
# (added 260930, from the Doctor's 260930 pass)
#
# systemd's shipped default is StartLimitIntervalSec=10s / Burst=5, but every managed
# unit here restarts with RestartSec=5s (27b-collm: 20s). Five restarts therefore span
# 20s (80s) — wider than the window that counts them — so the limit can NEVER trip and
# a crash-looping unit restarts forever. Observed: the SOS arm looped 09:36->12:48 and
# stopped only because an operator stopped it.
#
# 300s makes 5 failures in 5 minutes trip the unit to failed, which is the point: the
# loop ends and the Doctor pages instead of the box silently re-launching a broken arm.
# Cost: a tripped unit stays failed until `systemctl --user reset-failed <unit>`.
#
# Manager options are read by the manager, not by the units: after editing the live
# copy, `systemctl --user daemon-reexec` (a plain daemon-reload does not apply them).
# Verify: systemctl --user show -p DefaultStartLimitIntervalUSec
# Guard:  sh tests/run-all.sh   (restart_limit_check.py)
[Manager]
DefaultStartLimitIntervalSec=300
