# zz-cache-disk.conf — drop-in for gufo-llm (strixy2, the coding champion).
# Enable:  scp this file to strixy2:~/.config/systemd/user/gufo-llm.service.d/
#          ssh strixy2 'mkdir -p ~/.cache/gufo/continuation && systemctl --user daemon-reload'
#          then restart the unit when no live session is on it.
# Undo:    rm the drop-in + daemon-reload + restart.
#
# WHY: gufo retains ONE continuation per --sessions slot (default 1), and the
# scheduler is serial (`plan=serial-c1 batch_width=1`). Measured 260929: a client
# whose prompt does not match the retained prefix re-prefills from scratch at
# ~1000 t/s, so a 75k-token session costs ~80 s of TTFT, and every other client
# waits in queue_ms for all of it while its own decode stays at ~40 t/s. Four of
# 24 requests waited 77-110 s that way. See scripts/stall-audit.py.
#
# --cache-disk keeps snapshots on NVMe, so an evicted prefix is restored instead
# of re-prefilled, AND IT DOES SURVIVE A RESTART. Measured 260929 with one
# identical 12,067-token prompt either side of a config-identical restart:
#   A (cold)  prefill=12067 cached=0      ttft 9.00 s
#   B (after) prefill=0     cached=12067  ttft 0.333 s   cache=disk restore_ms=330
# gufo's own restart test passes too: check-continuation.py --restore <baseline>
# gave 8/8 cases disk=true, cached 344-388, prefill 0-7, exact=true, ttft 83-523 ms.
# My session restored cached_tokens=58325 from disk after the same restart.
#
# THE CATCH, and it bit me twice: snapshots are keyed by a compatibility_identity
# (inference_backend.cpp QwenFlashNextCompatibilityIdentity) carrying the artifact
# + MTP-draft fingerprints, chat_template sha256, context_tokens, and - with MTP on
# - `draft_cost_concurrency=<decode_concurrency>`, which is what -j sets. So ANY
# change to -j, -c, the weights or the template invalidates every file on disk.
# Both of my earlier "restarts throw the context away" readings were taken across a
# -j 1<->2 change; that is the documented key, not a defect. Expect a full
# re-prefill of every session after touching this drop-in.
# Also: the engine never logs a restore. event=disk_cache only ever shows
# action=stored; a restore appears solely as `cache=disk` / cache_restore_ms on the
# request line and as gufo.cache_disk_hit in the response. Do not read log silence
# as failure - I did, twice.
# Both flags are what the engine's own docs prescribe for this exact arm:
# "For Flash-Next/MTP at full 262K context, explicitly set
#  --cache-disk-staging-bytes 8589934592 (8 GiB) if RAM permits"
# (gufo docs/SERVER.md). Without it staging auto-caps at 1 GiB and our snapshots
# are ~2.2 GiB at 75k tokens (~7 GiB at 262k), so they would be skipped outright.
#
# --cache-disk-bytes 32 GiB instead of the 8 GiB default: one snapshot is already
# ~2.2 GiB, so the default budget holds one entry and alternating clients would
# still evict each other on disk. 302 GiB free on /, LRU-evicted after that.
#
# MEASURED 260929 after enabling (same two shapes sharing the arm: this 90k-token
# session + a 463-token battery, n=12). Before: 4/24 requests waited 77-110 s in
# queue_ms behind a re-prefill. After: 0/24 queue-blocked, worst request 33.8 s and
# that was 1189 tokens at 35 t/s, alternating requests show cache=disk instead of
# cache=miss. Worst queue_ms fell 83 s -> 27.9 s. Decode unchanged (35-47 t/s).
#
# THE COST, not free: a snapshot is ~2.7 GiB at 90k tokens and one is written per
# turn (write_ms 1.9-4.3 s, logged as event=disk_cache action=stored). A heavy
# coding day at 300-600 turns is 0.8-1.6 TB of NVMe writes, i.e. a few hundred TBW
# a year on a drive rated for ~600. Check wear with
#   sudo smartctl -A /dev/nvme0 | grep -iE "percentage|available_spare|wear"
# and if it climbs too fast, the knob to turn is --cache-disk-bytes (retention,
# not write volume) or a smaller --context; there is no checkpoint-cadence flag.
#
# -j 2 (= --sessions 2, "preallocated GPU request sessions") WAS tested 260929,
# not assumed. Cost: +3 GiB GTT (91.9 -> 95 GiB), cheaper than feared. It does
# batch: batch_width=2 appeared, and MTP survived it (draft_accepted 53/75, 70/96).
# But the two overlapping probes decoded at 27.8 t/s against 30.9-39.7 solo, and
# it did not rescue prefix retention (the vendor checker failed identically at
# -j 1 and -j 2). Reverted. Revisit only if two clients are routinely active in
# the same second rather than interleaved.
#
# NO open engine item. The check-continuation.py failure I reported earlier today
# was a stale harness, not the arm: it came from the Sep 26 copy
# (/home/piero/Downloads/Git/gufo-v6, d9a84f1) run against a b722a61 binary. Run it
# from strixy2:~/gufo-src, which is exactly b722a61 with a clean tree, and all 8
# cases pass (exact=true, full_prefill_equal=true). Rule: the checker ships with the
# build, so it must come from the tree the binary was built from.
#
# NOTE the ExecStart below is copied from the LIVE unit on strixy2 (gufo-bench
# binary, -c 262144 from ctx256k.conf), NOT from systemd/gufo-llm.service in this
# repo, which has drifted (different binary path, -c 196608). Filename starts
# with zz so this line is applied after ctx256k.conf; anything earlier alphabetically
# would be overridden by it and the flags would silently do nothing.
[Service]
ExecStart=
ExecStart=/home/piero/gufo-bench/gufo serve llm --model /home/piero/Downloads/LLM/Qwen38/flash-next-unsloth/UD-Q4_K_XL/Qwen3.8-Flash-Next-UD-Q4_K_XL-00001-of-00004.gguf --mmproj /home/piero/Downloads/LLM/Qwen38/flash-next-unsloth/mmproj-BF16.gguf --mtp-model /home/piero/Downloads/LLM/Qwen38/flash-next/mtp-Qwen3.8-Flash-Next-shared-Q8_0.gguf --speculative mtp -d 3 --reasoning-effort low -c 262144 -i 0.0.0.0 -p 8080 --served-model-name default --cache-disk /home/piero/.cache/gufo/continuation --cache-disk-bytes 34359738368 --cache-disk-staging-bytes 8589934592
